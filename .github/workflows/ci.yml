name: CI

on:
  push:
    branches: [main, mission/moredata]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: fmt clippy test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --verbose
      - run: cargo build -p moredata-cli
      - name: Offline render regression
        run: |
          cargo run -p moredata-cli -- render tests/fixtures/sine.mdproject --output /tmp/moredata-ci.wav --seconds 0.05 --json
          test -s /tmp/moredata-ci.wav
